name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      # ---------- base nutricional (USDA SR Legacy → SQLite)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache de datos USDA
        uses: actions/cache@v4
        with:
          path: tools/_cache
          key: usda-sr-legacy-2018-04

      - name: Generar nutrition.db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pandas
          if ! python tools/build_nutrition_db.py; then
            # Si la descarga del USDA falla, se reutiliza la base de la última versión publicada
            echo "::warning::No se pudo generar nutrition.db; se toma de la última versión publicada"
            mkdir -p /tmp/prev assets/db
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'recetas-arm64.apk' --dir /tmp/prev
            unzip -o -j /tmp/prev/recetas-arm64.apk assets/flutter_assets/assets/db/nutrition.db -d assets/db
          fi
          ls -la assets/db

      # ---------- Flutter
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter --version
          flutter create --org ar.majestad --project-name recetas_app --platforms android .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="recetas_app"/android:label="Recetas"/' $M
          # Internet para buscar actualizaciones en GitHub
          grep -q 'android.permission.INTERNET' $M || \
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          grep -n "INTERNET\|label" $M

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          cat analyze.log
          if [ $code -ne 0 ]; then
            grep -E "^\s*error" analyze.log | head -40 | while read -r l; do echo "::error title=analyze::$l"; done
            exit $code
          fi

      - name: Tests del motor de cálculo
        run: |
          set +e
          flutter test > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            msg=$(grep -aE "Expected|Actual|Error|error|FAILED|\[E\]|\.dart:[0-9]+" test.log | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::${msg}"
            exit $code
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=BUILD_NAME=0.1.${{ github.run_number }} 2>&1 | tee build.log || {
            # Publica el final del log como anotación (legible desde la API).
            msg=$(grep -aE "error|Error|FAILURE|What went wrong|Exception|>" build.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build apk::${msg}"
            exit 1
          }

      - name: Preparar archivos
        run: |
          mkdir -p dist
          # Firma con la clave fija del repo: así cada versión se instala encima
          # de la anterior. Falla si la huella no es la esperada.
          EXPECTED=76c8a86d68cf0d0cba57695a26ed31406e8104614adb7dcc41b5bcccb2b5b5ac
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for pair in arm64-v8a:arm64 armeabi-v7a:armv7; do
            src=build/app/outputs/flutter-apk/app-${pair%%:*}-release.apk
            out=dist/recetas-${pair##*:}.apk
            "$BT/apksigner" sign --ks ci/debug.keystore --ks-pass pass:android \
              --ks-key-alias androiddebugkey --key-pass pass:android --out "$out" "$src"
            "$BT/apksigner" verify --print-certs "$out" | tee cert.txt
            grep -qi "SHA-256 digest: $EXPECTED" cert.txt || {
              echo "::error title=firma::$out no quedó firmado con la clave fija"; exit 1; }
          done
          rm -f dist/*.idsig
          ls -la dist
          {
            # novedad para el usuario: el último commit que no sea de mantenimiento del CI
            git log -15 --format=%s | grep -vE '^(CI|Tests):' | head -1
            echo
            echo "Compilado desde ${{ github.sha }}."
            echo
            echo "- **recetas-arm64.apk**: para casi cualquier teléfono actual."
            echo "- **recetas-armv7.apk**: solo para teléfonos viejos de 32 bits."
            echo
            echo "Enlace fijo a la última versión:"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/recetas-arm64.apk"
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: recetas-apk-${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Recetas 0.1.${{ github.run_number }}
          make_latest: true
          files: dist/*.apk
          body_path: dist/notes.md
